services:
 monolithic-db:
  container_name: monolithic_db
  restart: always
  ports:
   - "5433:5432"
  environment:
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  
   POSTGRES_DB: ${POSTGRES_DB}
   POSTGRES_USER: ${POSTGRES_USER}
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U postgres"]
   interval: 5s
   timeout: 5s
   retries: 5
  
volumes:
    postgres_data: